# Configuration for the domain ekati.tech-ascend.com
<VirtualHost *:80>
    ServerName ekati.tech-ascend.com
    ServerAlias www.ekati.tech-ascend.com
    DocumentRoot /var/www/moodle

    ServerAdmin webmaster@ekati.tech-ascend.com

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /var/www/moodle>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# Default configuration for IP-based access
<VirtualHost *:80>
    ServerName default
    DocumentRoot /var/www/html

    # Alias for /ekati-app accessible via the IP address
    Alias /ekati-app /var/www/moodle

    <Directory /var/www/moodle>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ip-access-error.log
    CustomLog ${APACHE_LOG_DIR}/ip-access-access.log combined
</VirtualHost>
