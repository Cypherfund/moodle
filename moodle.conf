# VirtualHost for IP-based requests (144.126.245.61)
<VirtualHost 144.126.245.61:80>
    DocumentRoot /var/www/moodle

    # Map /ekati-app to /var/www/moodle
    Alias /ekati-app /var/www/moodle
    <Directory "/var/www/moodle">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# VirtualHost for HTTP (ekati.tech-ascend.com)
<VirtualHost *:80>
    ServerName ekati.tech-ascend.com
    DocumentRoot /var/www/moodle

    <Directory /var/www/moodle>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# VirtualHost for HTTPS (ekati.tech-ascend.com)
<VirtualHost *:443>
    ServerName ekati.tech-ascend.com
    DocumentRoot /var/www/moodle

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/tls.crt
    SSLCertificateKeyFile /etc/apache2/ssl/tls.key

    <Directory /var/www/moodle>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>